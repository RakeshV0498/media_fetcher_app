[project]
name = "media-fetcher"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi", "uvicorn", "sqlalchemy>=2", "alembic", "apscheduler",
  "httpx", "beautifulsoup4", "lxml", "feedparser", "guessit",
  "pydantic-settings", "argon2-cffi", "itsdangerous",
]
[project.optional-dependencies]
dev = ["pytest", "respx"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "../node_agent"]
